<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Free Market Monitor — BTC & XAU/USD</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!--
  Uses TradingView's own open-source "Lightweight Charts" library (free,
  MIT-licensed) via CDN — no build step, no npm install, just works as a
  static file. Data comes from btc_data.json / gold_data.json, which are
  regenerated every ~5 minutes by the GitHub Actions cron job (see
  chart_export.py) and committed alongside state.json.
-->
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid #21262d;
  }
  h1 { font-size: 18px; margin: 0 0 4px 0; font-weight: 600; }
  #updated { font-size: 12px; color: #8b949e; }

  .tabs { display: flex; gap: 8px; padding: 12px 20px 0 20px; }
  .tab-btn {
    background: #161b22;
    border: 1px solid #30363d;
    color: #c9d1d9;
    padding: 8px 16px;
    border-radius: 6px 6px 0 0;
    cursor: pointer;
    font-size: 13px;
  }
  .tab-btn.active { background: #0d1117; border-bottom-color: #0d1117; color: #58a6ff; }

  .panel { padding: 0 20px 20px 20px; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: #8b949e; padding: 10px 0; flex-wrap: wrap; }
  .legend span.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

  #price-chart { height: 420px; border: 1px solid #21262d; border-radius: 6px; }
  #rsi-chart   { height: 140px; border: 1px solid #21262d; border-top: none; border-radius: 0 0 6px 6px; }

  .status { font-size: 12px; color: #8b949e; padding: 8px 0; }
  .error { color: #f85149; }
</style>
</head>
<body>

<header>
  <h1>Free Market Monitor</h1>
  <div id="updated">Loading…</div>
</header>

<div class="tabs">
  <button class="tab-btn active" data-symbol="btc">BTC/USDT</button>
  <button class="tab-btn" data-symbol="gold">XAU/USD</button>
</div>

<div class="panel">
  <div class="legend">
    <span><span class="dot" style="background:#3fb950"></span>Price (candles)</span>
    <span><span class="dot" style="background:#e3b341"></span>MA</span>
    <span><span class="dot" style="background:#58a6ff"></span>RSI</span>
    <span id="config-line"></span>
  </div>
  <div id="price-chart"></div>
  <div id="rsi-chart"></div>
  <div class="status" id="status"></div>
</div>

<script>
const REFRESH_MS = 60 * 1000; // re-fetch JSON every 60s; underlying data updates ~every 5 min

let priceChart, rsiChart, candleSeries, maSeries, rsiSeries;
let overboughtLine, oversoldLine; // track price-line refs so we can remove old ones on refresh
let currentSymbol = "btc";

function makeCharts() {
  const commonOptions = {
    layout: { background: { color: "#0d1117" }, textColor: "#c9d1d9" },
    grid: { vertLines: { color: "#161b22" }, horzLines: { color: "#161b22" } },
    timeScale: { timeVisible: true, borderColor: "#21262d" },
    rightPriceScale: { borderColor: "#21262d" },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
  };

  priceChart = LightweightCharts.createChart(document.getElementById("price-chart"), {
    ...commonOptions,
    width: document.getElementById("price-chart").clientWidth,
    height: 420,
  });
  candleSeries = priceChart.addCandlestickSeries({
    upColor: "#3fb950", downColor: "#f85149",
    borderVisible: false,
    wickUpColor: "#3fb950", wickDownColor: "#f85149",
  });
  maSeries = priceChart.addLineSeries({ color: "#e3b341", lineWidth: 2 });

  rsiChart = LightweightCharts.createChart(document.getElementById("rsi-chart"), {
    ...commonOptions,
    width: document.getElementById("rsi-chart").clientWidth,
    height: 140,
  });
  rsiSeries = rsiChart.addLineSeries({ color: "#58a6ff", lineWidth: 2 });

  // Sync the two charts' visible time range together
  priceChart.timeScale().subscribeVisibleLogicalRangeChange(range => {
    if (range) rsiChart.timeScale().setVisibleLogicalRange(range);
  });
  rsiChart.timeScale().subscribeVisibleLogicalRangeChange(range => {
    if (range) priceChart.timeScale().setVisibleLogicalRange(range);
  });

  window.addEventListener("resize", () => {
    priceChart.applyOptions({ width: document.getElementById("price-chart").clientWidth });
    rsiChart.applyOptions({ width: document.getElementById("rsi-chart").clientWidth });
  });
}

async function loadData(symbolKey) {
  const filename = symbolKey === "btc" ? "btc_data.json" : "gold_data.json";
  const statusEl = document.getElementById("status");
  const updatedEl = document.getElementById("updated");

  try {
    // cache-bust so the browser always pulls the freshest committed JSON
    const resp = await fetch(`./${filename}?t=${Date.now()}`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();

    const candleData = data.candles.map(c => ({
      time: c.time, open: c.open, high: c.high, low: c.low, close: c.close,
    }));
    const maData = data.candles
      .filter(c => c.ma !== null)
      .map(c => ({ time: c.time, value: c.ma }));
    const rsiData = data.candles
      .filter(c => c.rsi !== null)
      .map(c => ({ time: c.time, value: c.rsi }));

    candleSeries.setData(candleData);
    maSeries.setData(maData);
    rsiSeries.setData(rsiData);

    // RSI overbought/oversold reference lines — remove any previous ones
    // first, since this function re-runs every 60s and createPriceLine()
    // would otherwise stack a new pair of lines on every refresh.
    if (overboughtLine) rsiSeries.removePriceLine(overboughtLine);
    if (oversoldLine) rsiSeries.removePriceLine(oversoldLine);
    overboughtLine = rsiSeries.createPriceLine({ price: data.rsi_overbought, color: "#f85149", lineStyle: 2, lineWidth: 1, title: "overbought" });
    oversoldLine = rsiSeries.createPriceLine({ price: data.rsi_oversold, color: "#3fb950", lineStyle: 2, lineWidth: 1, title: "oversold" });

    priceChart.timeScale().fitContent();
    rsiChart.timeScale().fitContent();

    document.getElementById("config-line").textContent =
      `${data.interval} candles · RSI(${data.rsi_length}) · ${data.ma_type.toUpperCase()}(${data.ma_length})`;

    const now = new Date();
    updatedEl.textContent = `${data.symbol} — last refreshed ${now.toLocaleTimeString()} (data updates ~every 5 min)`;
    statusEl.textContent = "";
    statusEl.classList.remove("error");
  } catch (err) {
    statusEl.textContent = `Could not load ${filename} — has the monitor run at least once since deployment? (${err.message})`;
    statusEl.classList.add("error");
  }
}

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentSymbol = btn.dataset.symbol;
    // Actually remove the old symbol's reference lines (not just forget
    // them) before loading the new symbol's data into the same series.
    if (overboughtLine) { rsiSeries.removePriceLine(overboughtLine); overboughtLine = null; }
    if (oversoldLine) { rsiSeries.removePriceLine(oversoldLine); oversoldLine = null; }
    loadData(currentSymbol);
  });
});

makeCharts();
loadData(currentSymbol);
setInterval(() => loadData(currentSymbol), REFRESH_MS);
</script>

</body>
</html>
